name: Deploy WEX index

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "apps/web-runtime/**"
      - "packages/wex/**"
      - "packages/catalogue/**"
      - "packages/ui/**"
      - "packages/schemas/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build runtime workspace dependencies
        run: pnpm --filter @weerax/schemas build && pnpm --filter @weerax/ui build

      - name: Type-check index
        run: pnpm --filter @weerax/web-runtime type-check

      - name: Test index
        run: pnpm --filter @weerax/web-runtime test

      - name: Verify retained Studio releases
        run: node tooling/scripts/verify-studio-releases.mjs --base "${{ github.event.before }}"

      - name: Verify Studio staging pointer
        run: node tooling/scripts/studio-staging-pointer.mjs verify --base "${{ github.event.before }}"

      - name: Build index
        run: pnpm --filter @weerax/web-runtime build

      - name: Verify published Studio release tree
        run: test -d apps/web-runtime/dist/studio-releases && test -f apps/web-runtime/dist/studio-releases/staging-pointer.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-runtime/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Studio staging pointer
        run: node tooling/scripts/studio-staging-pointer.mjs verify-live --url "${{ steps.deployment.outputs.page_url }}"
