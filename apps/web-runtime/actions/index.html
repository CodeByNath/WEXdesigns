<!doctype html>
<html lang="en" data-wex-theme="light">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="WEX Button presentation examples." /><title>Actions | WEX Design System</title><link rel="stylesheet" href="../src/catalogue.css" /></head>

    <div class="catalogue">

      <main id="main-content" class="catalogue-content wex-page-frame" tabindex="-1"><div class="catalogue-content__frame wex-layout"><section class="catalogue-content__surface system-settings" aria-labelledby="actions-title"><header class="system-settings__intro"><p class="system-settings__eyebrow wex-type-navigation-small-semibold">Foundation page</p><h1 id="actions-title" class="wex-type-heading-large-semibold">Actions</h1><p class="system-settings__summary wex-type-body-default-regular">Presentation-only examples; they do not invoke product actions.</p></header><div class="button-catalogue">

        <section class="button-variant" aria-labelledby="neutral-button-title"><h2 id="neutral-button-title" class="wex-type-title-default-semibold">Neutral</h2><div class="button-variant__samples"><button class="wex-button wex-button--neutral wex-button--small" type="button">Small</button><button class="wex-button wex-button--neutral wex-button--default" type="button">Default</button><button class="wex-button wex-button--neutral wex-button--large" type="button">Large</button><button class="wex-button wex-button--neutral wex-button--default" type="button" disabled>Disabled</button></div></section>
        <section class="button-variant" aria-labelledby="subtle-button-title"><h2 id="subtle-button-title" class="wex-type-title-default-semibold">Subtle</h2><div class="button-variant__samples"><button class="wex-button wex-button--subtle wex-button--small" type="button">Small</button><button class="wex-button wex-button--subtle wex-button--default" type="button">Default</button><button class="wex-button wex-button--subtle wex-button--large" type="button">Large</button><button class="wex-button wex-button--subtle wex-button--default" type="button" disabled>Disabled</button></div></section>
        <section class="button-variant" aria-labelledby="warning-button-title"><h2 id="warning-button-title" class="wex-type-title-default-semibold">Warning</h2><div class="button-variant__samples"><button class="wex-button wex-button--warning wex-button--small" type="button">Small</button><button class="wex-button wex-button--warning wex-button--default" type="button">Default</button><button class="wex-button wex-button--warning wex-button--large" type="button">Large</button><button class="wex-button wex-button--warning wex-button--default" type="button" disabled>Disabled</button></div></section>
        <section class="button-variant" aria-labelledby="danger-button-title"><h2 id="danger-button-title" class="wex-type-title-default-semibold">Danger</h2><div class="button-variant__samples"><button class="wex-button wex-button--danger wex-button--small" type="button">Small</button><button class="wex-button wex-button--danger wex-button--default" type="button">Default</button><button class="wex-button wex-button--danger wex-button--large" type="button">Large</button><button class="wex-button wex-button--danger wex-button--default" type="button" disabled>Disabled</button></div></section>
      </div></section></div></main>
      <footer class="catalogue-footer"><div class="catalogue-footer__inner"><span class="wex-type-navigation-small-semibold">WEX v1.1</span><span class="wex-type-body-small-regular">WeeraX Studios</span></div></footer>
