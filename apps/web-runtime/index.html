<!doctype html>
<html lang="en" data-wex-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The live index for the WEX design system and WeeraX Studios UI library."
    />
    <title>WEX Design System</title>
    <link rel="stylesheet" href="./src/catalogue.css" />
  </head>
  <body>
    <a class="skip-link wex-type-navigation-default-semibold" href="#main-content">
      Skip to content
    </a>

    <div class="catalogue">
      <header class="catalogue-header">
        <div class="catalogue-header__inner">
          <a class="catalogue-brand" href="./" aria-label="WEX Design System home">
            <span class="catalogue-brand__mark wex-type-title-large-semibold">WEX</span>
            <span class="catalogue-brand__name wex-type-navigation-default-semibold">
              Design System
            </span>
          </a>

          <div class="catalogue-header__meta">
            <span class="wex-type-navigation-small-semibold">Foundation v1.1</span>
            <label class="theme-control wex-type-navigation-small-semibold">
              <input id="theme-toggle" type="checkbox" />
              Dark theme
            </label>
          </div>
        </div>
      </header>

      <main id="main-content" class="catalogue-content wex-page-frame" tabindex="-1">
        <div class="catalogue-content__frame wex-layout">
          <section class="catalogue-content__surface" aria-label="Design system content"></section>
        </div>
      </main>

      <footer class="catalogue-footer">
        <div class="catalogue-footer__inner">
          <span class="wex-type-navigation-small-semibold">WEX v1.1</span>
          <span class="wex-type-body-small-regular">WeeraX Studios</span>
        </div>
      </footer>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
