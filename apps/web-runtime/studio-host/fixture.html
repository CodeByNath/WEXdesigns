<!doctype html>
<html lang="en" data-wex-theme="light">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>WEX Studio host fixture</title></head>
  <body>
    <div id="qsd-studio-host"></div>
    <script>
      const fixtureLogoUrl = new URLSearchParams(window.location.search).get('logoUrl');
      const fixturePrimaryActionImageUrl = new URLSearchParams(window.location.search).get('primaryActionImageUrl');
      globalThis.wexStudioHostOptions = {
        logoImageBinding: { source: 'profile.logo', target: 'imageUrl' },
        primaryActionIcon: 'primary',
        primaryActionImageBinding: { source: 'profile.primary-action-image', target: 'imageUrl' },
        sourceValues: {
          'profile.logo': fixtureLogoUrl ?? 'https://example.test/qsd-profile-logo.svg',
          'profile.primary-action-image': fixturePrimaryActionImageUrl,
        },
      };
    </script>
    <script type="module">
      // Optional fixture-only states for checking Footer availability in a browser.
      import { setAdminDrawerActionState } from '../src/admin-station-drawer-footer.js';
      const actionStates = {
        dirty: { dirty: true, publishable: false },
        publishable: { dirty: true, publishable: true },
        'publish-only': { dirty: false, publishable: true },
      };
      const actionState = actionStates[new URLSearchParams(location.search).get('drawerActionState')];
      if (actionState) document.addEventListener('wex:admin-drawer-request', (event) => {
        const shell = event.target;
        if (shell instanceof HTMLElement) queueMicrotask(() => setAdminDrawerActionState(shell, actionState));
      }, true);
    </script>
    <script type="module">
      // Fixture-only Form configuration storage: the test adapter over sessionStorage, so a published
      // configuration survives a refresh. ?formStorage=fail rejects Save/Publish; ?formStorage=off supplies none.
      import { createTestFormConfigurationAdapter } from './form-configuration-test-adapter.js';
      const formStorage = new URLSearchParams(location.search).get('formStorage');
      if (formStorage !== 'off') globalThis.wexStudioHostOptions.formConfigurationAdapter = createTestFormConfigurationAdapter(sessionStorage, { fail: formStorage === 'fail' });
    </script>
    <script type="module" src="../src/studio-host.js"></script>
  </body>
</html>
